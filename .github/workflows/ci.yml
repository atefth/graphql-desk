name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: "3.10"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      - run: uv run mypy

  dependencies:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: windows-2025
            python: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv export --locked --no-emit-project --output-file audit-requirements.txt
      # pip-audit 2.10.1's _SafeFileCache override avoids CacheControl's filelock calls; scope these exceptions to Python 3.10 until a patched compatible filelock is available.
      - if: matrix.python == '3.10'
        run: >-
          uv run pip-audit --strict --require-hashes --disable-pip
          --ignore-vuln CVE-2026-112906
          --ignore-vuln CVE-2026-112940
          --ignore-vuln CVE-2026-112914
          -r audit-requirements.txt
      - if: matrix.python != '3.10'
        run: uv run pip-audit --strict --require-hashes --disable-pip -r audit-requirements.txt
      - run: uv run python scripts/check_runtime_licenses.py

  smoke:
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        arch: [x64]
        include:
          - os: windows-2025
            python: "3.14"
            arch: x64
          - os: macos-14
            python: "3.14"
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Confirm runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: uv run python -c "import os, platform; actual=platform.machine().lower(); assert actual in ({'amd64','x86_64'} if os.environ['EXPECTED_ARCH']=='x64' else {'arm64','aarch64'}), actual"
      - run: uv run python -m unittest discover -s tests
      - run: uv run pyright
      - run: uv run mypy
      - run: uv build --no-sources --no-build-isolation
      - run: uv export --locked --no-dev --no-emit-project --output-file runtime-requirements.txt
      - run: uv run python scripts/check_distributions.py

  editor:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: "3.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: uv sync --locked
      - if: runner.os == 'Windows'
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-alt
          uv pip install --python .venv-alt/Scripts/python.exe -e .
      - run: npm ci --ignore-scripts
        working-directory: editor
      - run: npm test
        working-directory: editor
      - run: node --check test/run-host.cjs
        working-directory: editor
      - run: node --check test/features.host.cjs
        working-directory: editor
      - run: node --check test/discovery.host.cjs
        working-directory: editor
      - run: node --check test/restartRecovery.host.cjs
        working-directory: editor
      - run: node --check test/typingMatrix.host.cjs
        working-directory: editor
      - run: node --check test/lifecycle.host.cjs
        working-directory: editor
      - if: runner.os == 'Windows'
        env:
          GRAPHQL_DESK_ALTERNATE_PYTHON: ${{ github.workspace }}/.venv-alt/Scripts/python.exe
        run: node test/run-host.cjs 1.142.0 typingMatrix
        working-directory: editor
      - if: runner.os == 'Windows'
        run: node test/run-host.cjs 1.142.0 lifecycle
        working-directory: editor
      - run: npm audit
        working-directory: editor

  required:
    name: CI
    if: always()
    needs: [quality, dependencies, smoke, editor]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          QUALITY: ${{ needs.quality.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          SMOKE: ${{ needs.smoke.result }}
          EDITOR: ${{ needs.editor.result }}
        run: test "$QUALITY" = success && test "$DEPENDENCIES" = success && test "$SMOKE" = success && test "$EDITOR" = success
