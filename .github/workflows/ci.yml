name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code_changed: ${{ steps.paths.outputs.code_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          if not base or not head or set(base) == {"0"}:
              changed = [b"unknown"]
          else:
              result = subprocess.run(
                  ["git", "diff", "--name-only", "-z", f"{base}...{head}"],
                  check=True,
                  capture_output=True,
              )
              changed = [path for path in result.stdout.split(b"\0") if path]
          def markdown_only(paths):
              return bool(paths) and all(path.lower().endswith(b".md") for path in paths)

          assert markdown_only([b"AGENTS.md", b"docs/parity-plan.md"])
          assert not markdown_only([b".github/workflows/ci.yml"])
          assert not markdown_only([])
          docs_only = markdown_only(changed)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"code_changed={str(not docs_only).lower()}\n")
          PY

  quality:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: "3.10"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      - run: uv run mypy

  dependencies:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: windows-2025
            python: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv export --locked --no-emit-project --output-file audit-requirements.txt
      # pip-audit 2.10.1 uses _SafeFileCache, so CacheControl's vulnerable lock paths are not called; 4.2.1 drops Python 3.10.
      - if: matrix.python == '3.10'
        run: >-
          uv run pip-audit --strict --require-hashes --disable-pip
          --ignore-vuln GHSA-2g95-wg33-c5x2
          --ignore-vuln GHSA-crv4-6mhj-j5jh
          --ignore-vuln GHSA-v4x8-3wr5-3wq8
          --ignore-vuln GHSA-9vhv-jxww-xfm5
          --ignore-vuln GHSA-jqc4-5cvw-7w85
          --ignore-vuln GHSA-567q-5qvw-pf92
          -r audit-requirements.txt
      - if: matrix.python != '3.10'
        run: uv run pip-audit --strict --require-hashes --disable-pip -r audit-requirements.txt
      - run: uv run python scripts/check_runtime_licenses.py

  smoke:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        arch: [x64]
        include:
          - os: windows-2025
            python: "3.14"
            arch: x64
          - os: macos-14
            python: "3.14"
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Confirm runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: uv run python -c "import os, platform; actual=platform.machine().lower(); assert actual in ({'amd64','x86_64'} if os.environ['EXPECTED_ARCH']=='x64' else {'arm64','aarch64'}), actual"
      - run: uv run python -m unittest discover -s tests
      - run: uv run pyright
      - run: uv run mypy
      - run: uv build --no-sources --no-build-isolation
      - run: uv export --locked --no-dev --no-emit-project --output-file runtime-requirements.txt
      - run: uv run python scripts/check_distributions.py

  editor:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: "3.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
        working-directory: editor
      - run: npm test
        working-directory: editor
      - run: node --check test/run-host.cjs
        working-directory: editor
      - run: node --check test/features.host.cjs
        working-directory: editor
      - run: node --check test/discovery.host.cjs
        working-directory: editor
      - run: node --check test/restartRecovery.host.cjs
        working-directory: editor
      - run: node --check test/crashDuringGeneration.cjs
        working-directory: editor
      - run: node --check test/typingMatrix.host.cjs
        working-directory: editor
      - run: node --check test/malformedRecovery.host.cjs
        working-directory: editor
      - run: node --check test/lifecycle.host.cjs
        working-directory: editor
      - run: xvfb-run -a node test/run-host.cjs 1.141.0 features
        working-directory: editor
      - run: xvfb-run -a node test/run-host.cjs 1.141.0 activation
        working-directory: editor
      - run: xvfb-run -a node test/run-host.cjs 1.142.0 discovery
        working-directory: editor
      - run: xvfb-run -a node test/run-host.cjs 1.142.0 features
        working-directory: editor
      - run: xvfb-run -a node test/run-host.cjs 1.142.0 activation
        working-directory: editor
      - run: npm audit
        working-directory: editor

  editor-windows-unit:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: "3.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
        working-directory: editor
      - run: npm test
        working-directory: editor
      - run: node --check test/run-host.cjs
        working-directory: editor
      - run: node --check test/features.host.cjs
        working-directory: editor
      - run: node --check test/discovery.host.cjs
        working-directory: editor
      - run: node --check test/restartRecovery.host.cjs
        working-directory: editor
      - run: node --check test/crashDuringGeneration.cjs
        working-directory: editor
      - run: node --check test/typingMatrix.host.cjs
        working-directory: editor
      - run: node --check test/malformedRecovery.host.cjs
        working-directory: editor
      - run: node --check test/lifecycle.host.cjs
        working-directory: editor
      - run: npm audit
        working-directory: editor

  editor-windows-host:
    needs: [changes, editor-windows-unit]
    if: needs.changes.outputs.code_changed == 'true'
    name: editor Windows host (${{ matrix.suite }}, VS Code ${{ matrix.version }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - version: "1.142.0"
            suite: typingMatrix
          - version: "1.142.0"
            suite: mixedLists
          - version: "1.142.0"
            suite: externalMappings
          - version: "1.141.0"
            suite: factoryArtifacts
          - version: "1.142.0"
            suite: factoryArtifacts
          - version: "1.142.0"
            suite: malformedRecovery
          - version: "1.141.0"
            suite: lifecycle
          - version: "1.142.0"
            suite: lifecycle
          - version: "1.142.0"
            suite: restartRecoveryChangedInputs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          python-version: "3.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: uv sync --locked
      - if: matrix.suite == 'typingMatrix'
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-alt
          uv pip install --python .venv-alt/Scripts/python.exe -e .
      - run: npm ci --ignore-scripts
        working-directory: editor
      - run: node test/run-host.cjs "${{ matrix.version }}" "${{ matrix.suite }}"
        env:
          GRAPHQL_DESK_ALTERNATE_PYTHON: ${{ matrix.suite == 'typingMatrix' && format('{0}/.venv-alt/Scripts/python.exe', github.workspace) || '' }}
        working-directory: editor

  required:
    name: CI
    if: always()
    needs: [changes, quality, dependencies, smoke, editor, editor-windows-unit, editor-windows-host]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          QUALITY: ${{ needs.quality.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          SMOKE: ${{ needs.smoke.result }}
          EDITOR: ${{ needs.editor.result }}
          EDITOR_WINDOWS_UNIT: ${{ needs.editor-windows-unit.result }}
          EDITOR_WINDOWS_HOST: ${{ needs.editor-windows-host.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "Could not classify changed files."
            exit 1
          fi
          if [ "$CODE_CHANGED" = "false" ]; then
            echo "Markdown-only change: full CI checks skipped."
            exit 0
          fi
          test "$QUALITY" = success && test "$DEPENDENCIES" = success && test "$SMOKE" = success && test "$EDITOR" = success && test "$EDITOR_WINDOWS_UNIT" = success && test "$EDITOR_WINDOWS_HOST" = success
